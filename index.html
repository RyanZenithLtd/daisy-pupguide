<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3D2A1F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PupGuide" />
  <title>PupGuide — Puppy Trainer</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #F4EDE3;
      --paper: #FFFBF6;
      --ink: #2C1C14;
      --muted: #7A6558;
      --line: #E6D6C6;
      --terra: #C46A3A;
      --terra-d: #9B4E28;
      --sage: #4F7A62;
      --sage-s: #E4F0E8;
      --gold: #D4A017;
      --warn: #B5473A;
      --sky: #5B7C99;
      --radius: 18px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --nav-h: calc(64px + env(safe-area-inset-bottom, 0px));
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
    body { min-height: 100dvh; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { max-width: 480px; margin: 0 auto; min-height: 100dvh; background: var(--bg); position: relative; padding-bottom: var(--nav-h); }
    header.top {
      padding: calc(12px + env(safe-area-inset-top, 0px)) 18px 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .paw {
      width: 38px; height: 38px; border-radius: 12px; background: var(--terra);
      display: grid; place-items: center; font-size: 20px; color: #fff;
    }
    .brand h1 { font-size: 17px; margin: 0; letter-spacing: -0.02em; }
    .brand p { margin: 0; font-size: 12px; color: var(--muted); }
    .age-pill {
      background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 10px; font-size: 12px; color: var(--muted); white-space: nowrap;
    }
    main { padding: 0 16px 24px; }
    .card {
      background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 0 rgba(44,28,20,0.03);
    }
    .card h2 { margin: 0 0 8px; font-size: 15px; }
    .card h3 { margin: 0 0 6px; font-size: 14px; }
    .muted { color: var(--muted); font-size: 13px; line-height: 1.45; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      border: 0; border-radius: 12px; padding: 12px 14px; font-weight: 650;
      background: var(--terra); color: #fff; font-size: 14px;
    }
    .btn:active { transform: scale(0.98); }
    .btn.sage { background: var(--sage); }
    .btn.ghost { background: #F0E6DA; color: var(--ink); }
    .btn.warn { background: var(--warn); }
    .btn.sky { background: var(--sky); }
    .btn.block { width: 100%; }
    .btn.sm { padding: 8px 10px; font-size: 13px; font-weight: 600; }
    .field { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: #fff; margin: 6px 0 10px; }
    .chip {
      border: 1px solid var(--line); background: #fff; border-radius: 999px;
      padding: 8px 12px; font-size: 13px; color: var(--ink);
    }
    .chip.on { background: var(--sage-s); border-color: #B7D4C2; color: var(--sage); font-weight: 650; }
    nav.tabs {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
      width: min(480px, 100%); background: #fff; border-top: 1px solid var(--line);
      display: grid; grid-template-columns: repeat(5, 1fr);
      padding: 6px 4px var(--safe-b); z-index: 20;
    }
    nav.tabs button {
      border: 0; background: transparent; color: var(--muted);
      font-size: 10px; font-weight: 650; padding: 6px 0 8px; display: flex;
      flex-direction: column; align-items: center; gap: 2px;
    }
    nav.tabs button .i { font-size: 18px; line-height: 1; }
    nav.tabs button.active { color: var(--terra-d); }
    .statgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat {
      background: #F8F1E8; border-radius: 14px; padding: 12px;
    }
    .stat b { display: block; font-size: 20px; letter-spacing: -0.03em; }
    .stat span { font-size: 11px; color: var(--muted); }
    .next {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .timer { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 750; letter-spacing: -0.04em; }
    .loop {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px;
    }
    .loop div {
      text-align: center; font-size: 11px; padding: 8px 4px; border-radius: 10px;
      background: #F3E8DC; color: var(--muted);
    }
    .loop div.now { background: #F8D7C0; color: var(--terra-d); font-weight: 700; }
    .log-item {
      display: flex; justify-content: space-between; gap: 8px; padding: 10px 0;
      border-bottom: 1px solid var(--line); font-size: 13px;
    }
    .log-item:last-child { border-bottom: 0; }
    .log-item .right { display: flex; align-items: center; gap: 8px; flex: none; }
    .btn.undo {
      background: transparent; color: var(--warn); padding: 6px 8px; font-size: 12px; font-weight: 650;
    }
    .toast {
      margin-top: 10px; background: var(--sage-s); border: 1px solid #B7D4C2; color: #244536;
      border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.4; font-weight: 650;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .toast.warn { background: #FCE8E4; border-color: #E8B4AC; color: #7A2E26; }
    .ok { color: var(--sage); font-weight: 700; }
    .bad { color: var(--warn); font-weight: 700; }
    label.field { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
    input[type=text], input[type=date], input[type=time], input[type=number], select, textarea {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
      background: #fff; color: var(--ink);
    }
    textarea { min-height: 70px; resize: vertical; }
    .lesson { margin-bottom: 10px; }
    .lesson summary {
      list-style: none; cursor: pointer; font-weight: 700; font-size: 14px;
      padding: 12px; background: #F8F1E8; border-radius: 12px;
    }
    .lesson summary::-webkit-details-marker { display: none; }
    .lesson .body { padding: 10px 4px 4px; font-size: 13px; line-height: 1.5; color: #3a2a22; }
    .lesson ol { margin: 6px 0; padding-left: 18px; }
    .check {
      display: flex; gap: 10px; align-items: flex-start; padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .check input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--sage); flex: none; }
    .check label { font-size: 14px; }
    .check .sub { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
    .hidden { display: none !important; }
    .banner {
      background: #FFF3D6; border: 1px solid #E8D08A; color: #6A4E12;
      border-radius: 14px; padding: 12px; font-size: 13px; line-height: 1.45; margin-bottom: 12px;
    }
    .banner.green { background: var(--sage-s); border-color: #B7D4C2; color: #244536; }
    .week-chip { font-size: 11px; background: #EFE4D6; color: var(--muted); border-radius: 6px; padding: 2px 6px; margin-left: 6px; }
    .progress {
      height: 8px; background: #EFE4D6; border-radius: 99px; overflow: hidden; margin: 8px 0 4px;
    }
    .progress > i { display: block; height: 100%; background: var(--sage); width: 0%; }
    .empty { text-align: center; color: var(--muted); padding: 16px 8px; font-size: 13px; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(44,28,20,0.35); z-index: 40;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      width: min(480px, 100%); background: var(--paper); border-radius: 22px 22px 0 0;
      padding: 16px 16px calc(20px + var(--safe-b));
    }
    .sheet h3 { margin: 0 0 8px; }
    .onboard {
      min-height: 100dvh; padding: calc(28px + env(safe-area-inset-top)) 20px 28px;
      display: flex; flex-direction: column; justify-content: center;
    }
    .onboard h1 { font-size: 28px; letter-spacing: -0.04em; margin: 0 0 8px; }
    .tiny { font-size: 11px; color: var(--muted); }
    ul.clean { margin: 6px 0; padding-left: 18px; font-size: 13px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="app" id="app"></div>

  <script>
  const SKILLS = {
    "8-9": [
      { id: "marker", name: "Marker word (“Yes!”)", why: "Tells her the exact moment she did the right thing.", steps: ["Have treats ready in a quiet room.", "Say “Yes!” in a happy voice, then immediately give a tiny treat. Repeat 8–10 times.", "Do not ask for a behaviour yet. You are teaching that “Yes!” predicts food.", "Later, say “Yes!” the instant she looks at you or offers a sit."] },
      { id: "name", name: "Name game", why: "Attention is the root of every other skill.", steps: ["Say her name once, softly.", "The moment she looks toward you, mark (“Yes!”) and treat near your knees.", "If she ignores you, make a tiny kiss sound, then mark the look.", "Never use her name to scold. Keep it golden."] },
      { id: "potty", name: "Potty on cue", why: "You want her to toilet on a word, not wander hoping.", steps: ["Carry or leash her to the same outdoor spot.", "Stand still. Quietly say a cue like “be quick”.", "The second she finishes, mark and jackpot (3–5 tiny treats) outside.", "Go back in. Accidents inside get a calm scoop, enzymatic cleaner, no scolding."] },
      { id: "crate", name: "Crate as a den", why: "A loved crate prevents accidents and overstimulation.", steps: ["Door open. Toss treats just inside. Let her walk in and out.", "Feed meals in the crate.", "Close the door for 30–60 seconds while you sit nearby, then open before she panics.", "Build to 30–45 minute naps. Never use the crate as punishment."] },
      { id: "handling", name: "Happy handling", why: "Vet, nails, ears and teeth will be easy later.", steps: ["Touch one paw for one second, mark, treat.", "Repeat ears, collar area, tail, mouth (lift a lip).", "Stop while she is still happy. Tiny sessions beat long ones.", "Pair a toothbrush or nail clipper appearing with treats, no clipping yet if she is unsure."] },
      { id: "bite", name: "Bite inhibition", why: "Puppy teeth hurt. She must learn jaws are for toys.", steps: ["If she mouths skin, freeze and go quiet. Withdraw attention for 5–10 seconds.", "Offer a chew or tug toy as the legal thing.", "If she keeps escalating, end the play session and start a nap. Overtired pups bite more.", "Do not wrestle with your hands or squeal in a way that revs her up."] },
      { id: "settle", name: "Settle on a mat", why: "An off-switch stops the evening gremlin hour.", steps: ["Put a mat or towel down. Scatter a few treats on it.", "When she stands on it, mark and drop more treats on the mat.", "Gradually wait for a sit, then a down.", "Use it after play, before guests, and during TV time."] }
    ],
    "10-12": [
      { id: "sit", name: "Sit (lure then fade)", why: "A default sit is polite greetings and impulse control.", steps: ["Hold a treat at her nose. Lift it slowly up and back over her head.", "As her bottom hits the floor, mark and treat.", "After she understands, say “sit” just before the lure.", "Fade the lure: empty hand gesture, then treat from the other hand."] },
      { id: "recall", name: "Come when called (indoors)", why: "Recall saves lives. Start easy and make it joyful.", steps: ["Kneel a few steps away in a hallway. Say her name, then “come!” in a party voice.", "As she runs in, mark, then treat between your knees.", "Never call her for something she hates (nail trim, end of play) at this stage.", "Play ping-pong recalls between two people."] },
      { id: "leash", name: "Leash indoors", why: "Teach slack leash before the street is exciting.", steps: ["Clip a lightweight leash. Let her drag it under supervision for a minute.", "Walk around the room dropping treats at your side when the leash is loose.", "If she plants or bites the leash, pause, then restart with a treat trail.", "Keep sessions under 2 minutes."] },
      { id: "leave", name: "Leave it (easy version)", why: "Stops her eating socks, stones and dropped food.", steps: ["Hold a closed fist with a treat. Wait. The instant she looks away or backs off, mark and give a better treat from the other hand.", "She never gets the “leave it” item in this game.", "Progress to treat on the floor under your shoe, then uncovered but covered by your hand if she dives."] }
    ],
    "13-16": [
      { id: "down", name: "Down", why: "A down is calmer than a sit and useful in cafes later.", steps: ["From a sit, lure the treat from her nose down to the floor between her paws, then slightly toward her chest.", "Mark when elbows hit the floor.", "If she pops up, make the lure slower and lower.", "Add the word “down” once she is offering it."] },
      { id: "stay", name: "Stay — 1 to 3 seconds", why: "Duration comes later. First teach “wait a beat”.", steps: ["Ask for a sit. Say “stay”, open your hand like a stop sign.", "Count one second, mark, treat while she is still sitting.", "Take a half-step away only after one second is easy.", "Reset if she moves. Short success beats long failure."] },
      { id: "outside-leash", name: "First outdoor walks", why: "Sniffing is the walk. Loose leash is extra.", steps: ["Until vaccines allow pavement, carry her and let her watch the world, or use a quiet private garden.", "Keep the “walk” 3–8 minutes. Let her sniff.", "Treat at your side when she chooses to come with you.", "If she sits and refuses, you went too far or too long. Carry her home cheerfully."] },
      { id: "trade", name: "Drop / trade", why: "You will need things back from her mouth.", steps: ["When she has a toy, present a higher-value treat at her nose.", "As she opens her mouth, say “drop”, take the toy, give the treat, then give the toy back.", "Trading makes her want to bring you things instead of guarding them."] }
    ]
  };

  const SOCIAL = [
    { g: "People", items: [
      "A man (ideally with a deeper voice)", "A woman", "A child (supervised, calm)", "Someone older / using a walking aid",
      "Person in a hat", "Sunglasses", "Hoodie or bulky coat", "Uniform or hi-vis", "Beard", "Someone of a different ethnicity to your household",
      "Delivery person at a distance", "Person jogging past (watch, don’t chase)"
    ]},
    { g: "Handling", items: [
      "Paws touched and gently squeezed", "Nails looked at (clipper present)", "Ears lifted and peeked in", "Lips lifted, teeth seen",
      "Collar on and off", "Harness on and off", "Picked up and put down calmly", "Towel dry after a wipe", "Gentle restraint for 2 seconds", "Belly rub while lying down"
    ]},
    { g: "Surfaces", items: [
      "Grass", "Pavement / concrete", "Tile or lino", "Carpet", "Wood floor", "Gravel or bark", "A metal grate or manhole cover (optional)", "Shallow puddle or wet grass", "A step or low stair", "Car boot / crate floor"
    ]},
    { g: "Sounds (start quiet)", items: [
      "Doorbell / knock", "Vacuum in another room", "Hairdryer far away", "Traffic from a doorway or window", "Clattering bowl / cutlery",
      "TV or music", "Thunderstorm recording at low volume", "Kids playing in the distance", "Washing machine", "A bike bell or scooter"
    ]},
    { g: "Places (carry until vet says ground is OK)", items: [
      "Short car ride that ends with treats", "Sat outside a café / shop on your lap", "Vet clinic for treats only — no jab", "Friend’s quiet house",
      "Hardware store carried in arms or trolley", "Garden of a vaccinated adult dog (if invited)", "Different room of your own home with door closed briefly", "Near a park, watching from a bench"
    ]},
    { g: "Objects & motion", items: [
      "Umbrella opening at a distance", "Pram or wheelchair passing", "Bicycle wheeled past", "Broom or mop", "Bin bag / recycling box", "A balloon or plastic bag rustle", "Skateboard or scooter at a distance"
    ]}
  ];

  const DEFAULT = {
    v: 2,
    puppy: {
      name: "Daisy",
      dob: "",
      wake: "07:00",
      weightKg: 1.9,
      meals: 4,
      mealTimes: ["07:30", "12:00", "16:30", "22:15"],
      foods: [
        { name: "Iams dry", kind: "kibble", note: "Main meals — follow the bag for a ~2 kg puppy, split across 4 feeds" },
        { name: "Pedigree Chum Puppy", kind: "wet", note: "Can mix a spoon into kibble if she needs extra smell/moisture" },
        { name: "Wellness CORE puppy treats", kind: "treat", note: "Training only — rice-sized pieces, count them toward the day’s food" }
      ]
    },
    potty: [],
    training: [],
    social: {},
    feeds: [],
    weights: [{ kg: 1.9, note: "starting weight" }],
    naps: [],
    nap: null,
    crateLove: 0,
    onboarded: false,
    notify: false,
    cloudUrl: "https://daisy-save.ryan-e58.workers.dev",
    syncCode: "",
    lastCloud: "",
    updatedAt: 0,
    ntfyTopic: ""
  };

  const $ = (sel, el=document) => el.querySelector(sel);

  function migrate(raw) {
    const s = { ...structuredClone(DEFAULT), ...raw };
    s.puppy = { ...DEFAULT.puppy, ...(raw.puppy || {}) };
    if (!s.puppy.name || s.puppy.name === "Puppy") s.puppy.name = "Daisy";
    if (!s.puppy.wake) s.puppy.wake = "07:00";
    if (!s.puppy.weightKg) s.puppy.weightKg = 1.9;
    if (!Array.isArray(s.puppy.mealTimes) || s.puppy.mealTimes.length < 2) {
      s.puppy.mealTimes = DEFAULT.puppy.mealTimes.slice();
    }
    if (!Array.isArray(s.puppy.foods) || !s.puppy.foods.length) {
      s.puppy.foods = DEFAULT.puppy.foods.map(f => ({ ...f }));
    }
    if (!Array.isArray(s.feeds)) s.feeds = [];
    if (!Array.isArray(s.naps)) s.naps = [];
    if (!("nap" in s)) s.nap = null;
    if (typeof s.notify !== "boolean") s.notify = false;
    if (!s.cloudUrl) s.cloudUrl = DEFAULT.cloudUrl;
    if (!s.syncCode) s.syncCode = "";
    if (!s.lastCloud) s.lastCloud = "";
    if (!s.updatedAt) s.updatedAt = Date.now();
    if (!s.ntfyTopic) s.ntfyTopic = "";
    if (!Array.isArray(s.weights) || !s.weights.length) s.weights = [{ kg: s.puppy.weightKg, note: "starting weight" }];
    if (!s.puppy.dropTo3 || !s.puppy.dropTo2) {
      const plan = defaultMealPlan(s.puppy.dob);
      s.puppy.dropTo3 = s.puppy.dropTo3 || plan.dropTo3;
      s.puppy.dropTo2 = s.puppy.dropTo2 || plan.dropTo2;
    }
    s.v = 3;
    return s;
  }
  function load() {
    try { return migrate(JSON.parse(localStorage.getItem("pupguide") || "{}")); }
    catch { return structuredClone(DEFAULT); }
  }
  function save(state, opts) {
    const dirty = !opts || opts.dirty !== false;
    if (dirty) state.updatedAt = Date.now();
    localStorage.setItem("pupguide", JSON.stringify(state));
    if (dirty) queueCloudSync();
  }
  let syncTimer = null;
  let syncing = false;
  function queueCloudSync() {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(() => { syncCloud(); }, 800);
  }
  function cloudUrlFor(code) {
    const base = (S.cloudUrl || DEFAULT.cloudUrl).replace(/\/$/, "");
    return base + "/api/save/" + encodeURIComponent(code);
  }
  async function syncCloud(force) {
    const code = (S.syncCode || "").trim();
    if (!/^[a-zA-Z0-9_-]{8,64}$/.test(code) || syncing) return { ok: false, reason: "no-code" };
    syncing = true;
    try {
      const url = cloudUrlFor(code);
      const res = await fetch(url);
      const j = await res.json().catch(() => ({}));
      const remote = j && j.ok && j.data ? j.data : null;
      const localTs = Number(S.updatedAt || 0);
      const remoteTs = Number(remote && remote.updatedAt || 0);
      if (!remote) {
        await fetch(url, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(S) });
        S.lastCloud = new Date().toLocaleString();
        save(S, { dirty: false });
        return { ok: true, action: "upload-first" };
      }
      if (remoteTs > localTs || force === "pull") {
        const nap = remote.nap || null;
        const naps = Array.isArray(remote.naps) ? remote.naps : [];
        remote.syncCode = code;
        remote.cloudUrl = S.cloudUrl || DEFAULT.cloudUrl;
        S = migrate(remote);
        S.nap = nap;
        S.naps = naps;
        S.onboarded = true;
        S.lastCloud = new Date().toLocaleString();
        S.updatedAt = remoteTs || Date.now();
        save(S, { dirty: false });
        return { ok: true, action: "pull" };
      }
      if (localTs > remoteTs || force === "push") {
        await fetch(url, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(S) });
        S.lastCloud = new Date().toLocaleString();
        save(S, { dirty: false });
        return { ok: true, action: "push" };
      }
      return { ok: true, action: "same" };
    } catch (e) {
      return { ok: false, reason: e.message || "sync failed" };
    } finally {
      syncing = false;
    }
  }

  function parseDay(s) {
    if (!s) return null;
    const d = new Date(s + "T00:00:00");
    return isNaN(d.getTime()) ? null : d;
  }
  function ymd(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function addDays(d, n) {
    const x = new Date(d.getTime());
    x.setDate(x.getDate() + n);
    return x;
  }
  function defaultMealPlan(dob) {
    const birth = parseDay(dob) || addDays(new Date(), -8 * 7);
    return {
      dropTo3: ymd(addDays(birth, 12 * 7)),
      dropTo2: ymd(addDays(birth, 26 * 7))
    };
  }
  function prettyDay(s) {
    const d = parseDay(s);
    if (!d) return "—";
    return d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  }
  function daysUntil(s) {
    const d = parseDay(s);
    if (!d) return null;
    const a = new Date(); a.setHours(0,0,0,0);
    const b = new Date(d); b.setHours(0,0,0,0);
    return Math.round((b - a) / 86400000);
  }
  function mealStage() {
    const n3 = daysUntil(S.puppy.dropTo3);
    const n2 = daysUntil(S.puppy.dropTo2);
    if (n2 != null && n2 <= 0) return { count: 2, label: "2 meals a day", until: null, next: null };
    if (n3 != null && n3 <= 0) return { count: 3, label: "3 meals a day", until: S.puppy.dropTo2, next: 2 };
    return { count: 4, label: "4 meals a day", until: S.puppy.dropTo3, next: 3 };
  }
  function suggestedTimes(count) {
    if (count <= 2) return ["08:00", "18:00"];
    if (count === 3) return ["07:30", "13:00", "18:30"];
    return ["07:30", "12:00", "16:30", "22:15"];
  }
  function weeksOld(dob) {
    if (!dob) return 8;
    const ms = Date.now() - new Date(dob + "T00:00:00").getTime();
    return Math.max(1, Math.floor(ms / (7 * 24 * 3600 * 1000)));
  }
  function band(w) {
    if (w <= 9) return "8-9";
    if (w <= 12) return "10-12";
    return "13-16";
  }
  function holdMins(w) {
    // Realistic awake interval, not the theoretical max
    if (w <= 8) return 40;
    if (w <= 9) return 50;
    if (w <= 10) return 60;
    if (w <= 12) return 75;
    if (w <= 14) return 90;
    return 110;
  }
  function crateMins(w) {
    if (w <= 9) return 40;
    if (w <= 11) return 60;
    if (w <= 14) return 90;
    return 120;
  }
  function fmtTime(d) {
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }
  function todayKey(d=new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function parseHM(hm) {
    const [h, m] = String(hm || "07:00").split(":").map(Number);
    const d = new Date();
    d.setHours(h || 0, m || 0, 0, 0);
    return d;
  }
  function loggedMealNs() {
    return new Set(todaysFeeds().map(f => Number(f.mealN)).filter(n => n > 0));
  }
  function inferMealN(when) {
    const times = (S.puppy.mealTimes || []).filter(Boolean);
    const at = when || new Date();
    if (!times.length) return todaysFeeds().length + 1;
    let best = 1, bestDiff = Infinity;
    times.forEach((hm, i) => {
      const d = Math.abs(parseHM(hm).getTime() - at.getTime());
      if (d < bestDiff) { bestDiff = d; best = i + 1; }
    });
    const used = loggedMealNs();
    if (!used.has(best)) return best;
    for (let i = 0; i < times.length; i++) {
      const n = i + 1;
      if (used.has(n)) continue;
      if (parseHM(times[i]).getTime() >= at.getTime() - 20 * 60000) return n;
    }
    for (let n = 1; n <= times.length; n++) if (!used.has(n)) return n;
    return best;
  }
  function nextMealTime() {
    const times = (S.puppy.mealTimes || []).filter(Boolean);
    if (!times.length) return null;
    const used = loggedMealNs();
    const now = new Date();
    for (let i = 0; i < times.length; i++) {
      if (used.has(i + 1)) continue;
      const d = parseHM(times[i]);
      if (d.getTime() > now.getTime() - 2 * 60000) return d;
    }
    const d = parseHM(times[0]);
    d.setDate(d.getDate() + 1);
    return d;
  }
  function minsUntil(d) {
    return Math.round((d.getTime() - Date.now()) / 60000);
  }
  function todaysFeeds() {
    const k = todayKey();
    return S.feeds.filter(f => todayKey(new Date(f.ts)) === k);
  }
  function addMins(d, n) {
    const x = new Date(d.getTime());
    x.setMinutes(x.getMinutes() + n);
    return x;
  }
  function napEndAt(nap) {
    return addMins(new Date(nap.start), nap.plannedMins || 40);
  }
  function activeNap() {
    return S.nap && !S.nap.end ? S.nap : null;
  }
  function napWindows() {
    const list = [...(S.naps || [])];
    const cur = activeNap();
    if (cur) list.push({ start: cur.start, end: napEndAt(cur).toISOString() });
    return list.map(n => ({
      start: new Date(n.start),
      end: n.end ? new Date(n.end) : napEndAt(n)
    }));
  }
  function duringNap(t) {
    return napWindows().some(w => t.getTime() >= w.start.getTime() && t.getTime() < w.end.getTime());
  }
  function lastWakeAnchor() {
    const ended = (S.naps || []).filter(n => n.end).sort((a, b) => new Date(a.end) - new Date(b.end));
    if (ended.length) {
      const last = new Date(ended[ended.length - 1].end);
      if (todayKey(last) === todayKey()) return last;
    }
    return parseHM(S.puppy.wake || "07:00");
  }
  function pottySchedule(w) {
    const morning = parseHM(S.puppy.wake || "07:00");
    const gap = holdMins(w);
    const meals = (S.puppy.mealTimes || []).map(parseHM).sort((a, b) => a - b);
    const trips = [];
    const push = (t, label, tag) => {
      const d = new Date(t);
      if (tag === "tick" && duringNap(d)) return;
      trips.push({ t: d, label, tag, hm: fmtTime(d) });
    };
    const cur = activeNap();
    if (cur) {
      const ends = napEndAt(cur);
      push(ends, "Nap ending — check her, then carry straight outside", "napend");
      push(addMins(ends, 1), "Potty on waking from nap", "wake");
      let cursor = addMins(ends, gap);
      meals.forEach((m, i) => {
        if (m.getTime() > ends.getTime()) push(addMins(m, 12), "After meal " + (i + 1) + " (" + fmtTime(m) + ")", "meal");
      });
      const lastMeal = meals.length ? meals[meals.length - 1] : addMins(morning, 12 * 60);
      const bed = addMins(lastMeal, 30);
      push(bed, "Last potty, then bed in the crate", "bed");
      while (cursor.getTime() < bed.getTime() - 8 * 60000) {
        const clash = trips.some(tr => Math.abs(tr.t - cursor) < 12 * 60000);
        if (!clash) push(new Date(cursor), "Timed break while awake", "tick");
        cursor = addMins(cursor, gap);
      }
    } else {
      const anchor = lastWakeAnchor();
      const isMorning = Math.abs(anchor - morning) < 5 * 60000;
      push(anchor, isMorning ? "Wake — carry straight outside" : "Up from nap — carry straight outside", "wake");
      meals.forEach((m, i) => {
        if (m.getTime() + 12 * 60000 >= anchor.getTime() - 5 * 60000) {
          push(addMins(m, 12), "After meal " + (i + 1) + " (" + fmtTime(m) + ")", "meal");
        }
      });
      const lastMeal = meals.length ? meals[meals.length - 1] : addMins(morning, 12 * 60);
      const bed = addMins(lastMeal, 30);
      push(bed, "Last potty, then bed in the crate", "bed");
      let cursor = addMins(anchor, gap);
      while (cursor.getTime() < bed.getTime() - 8 * 60000) {
        const clash = trips.some(tr => Math.abs(tr.t - cursor) < 12 * 60000);
        if (!clash) push(new Date(cursor), "Timed break while awake", "tick");
        cursor = addMins(cursor, gap);
      }
      if (w <= 12) {
        push(addMins(bed, w <= 9 ? 210 : 280), "Night potty if she stirs — lights low, no play", "night");
      }
    }
    trips.sort((a, b) => a.t - b.t);
    const out = [];
    trips.forEach(tr => {
      const prev = out[out.length - 1];
      if (prev && Math.abs(prev.t - tr.t) < 8 * 60000) {
        const rank = { napend: 5, wake: 4, meal: 3, bed: 3, night: 2, tick: 1 };
        if ((rank[tr.tag] || 0) > (rank[prev.tag] || 0)) out[out.length - 1] = tr;
      } else out.push(tr);
    });
    return out;
  }
  function nextPottyTrip(w) {
    const cur = activeNap();

        label: overdue ? "Nap time is up — check her, then straight outside" : "Let her sleep. Next potty when the nap ends",
        tag: "napend",
        hm: fmtTime(ends)

    const now = Date.now() - 2 * 60000;
    return pottySchedule(w).find(tr => tr.t.getTime() >= now) || null;
  }
  function napCardHTML(w) {

  function bindView() {
    async function enableReminders() {
      if (S.notify) {
        S.notify = false;
        flash = { text: "Reminders are OFF. No pings until you turn them on again." };
        save(S); render();
        return;
      }
      let granted = false;
      if ("Notification" in window) {
        let perm = Notification.permission;
        if (perm !== "granted") {
          try { perm = await Notification.requestPermission(); } catch (e) { perm = "denied"; }
        }
        granted = perm === "granted";
      }
      S.notify = true;
      flash = granted
        ? { text: "Reminders are ON. Meals and nap check-ins only. Keep this tab open." }
        : { text: "Reminders are ON in the app (meals + nap). Chrome may still block a lock-screen banner.", tone: "warn" };
      save(S); render();
    }
    const box = document.getElementById("syncCode");
    if (box) box.onchange = () => {
      const v = box.value.trim();
      if (v) { S.syncCode = v; save(S); }
    };
    async function pushCloud(quiet) {
      if (document.getElementById("syncCode") && document.getElementById("syncCode").value.trim()) {
        S.syncCode = document.getElementById("syncCode").value.trim();
        save(S, { dirty: false });
      }
      const r = await syncCloud();
      if (!quiet) {
        flash = !S.syncCode
          ? { text: "Set a sync code in More first.", tone: "warn" }
          : r.action === "pull"
            ? { text: "This phone was behind. Loaded the newer cloud copy (naps included)." }
            : r.action === "push" || r.action === "upload-first"
              ? { text: "This phone was newer. Saved to cloud." }
              : r.ok
                ? { text: "Already in sync." }
                : { text: "Sync failed. " + (r.reason || ""), tone: "warn" };
        render();
      } else if (r.action === "pull") render();
      return r.ok;
    }
    async function pullCloud() {
      if (document.getElementById("syncCode") && document.getElementById("syncCode").value.trim()) {
        S.syncCode = document.getElementById("syncCode").value.trim();
        save(S, { dirty: false });
      }
      const r = await syncCloud("pull");
      flash = r.ok
        ? { text: S.nap && !S.nap.end ? "Forced load. Nap timer is from the cloud." : "Forced load from cloud." }
        : { text: "Load failed. " + (r.reason || ""), tone: "warn" };
      render();
    }
    ["cloudSave", "cloudSaveHome"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onclick = () => pushCloud(false);
    });
    ["cloudLoad", "cloudLoadHome"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.onclick = pullCloud;
    });
    const toggleNotify = document.getElementById("toggleNotify");
    if (toggleNotify) toggleNotify.onclick = enableReminders;
    const toggleNotifyHome = document.getElementById("toggleNotifyHome");
    if (toggleNotifyHome) toggleNotifyHome.onclick = enableReminders;
    const testNotify = document.getElementById("testNotify");
    if (testNotify) testNotify.onclick = () => {
      pingNotify("Daisy — test banner", "This is the reminder style for meals and nap check-ins.");
      const locked = !("Notification" in window) || Notification.permission !== "granted";
      flash = {
        text: locked
          ? "This is the in-app banner. Chrome blocked the lock-screen one for this file — that is expected. Leave the tab open to see these."
          : "Banner OK. You should see this strip and a Chrome notification.",
        tone: locked ? "warn" : ""
      };
      render();
    };
    async function ntfySend(title, body, extraHeaders) {
      const topic = ((document.getElementById("ntfyTopic") || {}).value || S.ntfyTopic || "").trim();
      if (!/^[a-zA-Z0-9_-]{8,64}$/.test(topic)) return { ok: false, reason: "no-topic" };
      S.ntfyTopic = topic;
      save(S, { dirty: false });
      const ascii = s => String(s || "").replace(/[^\x20-\x7E]/g, "-");
      const headers = { Title: ascii(title), Priority: "high", Tags: "dog" };
      Object.entries(extraHeaders || {}).forEach(([k, v]) => { headers[ascii(k)] = ascii(v); });
      try {
        const res = await fetch("https://ntfy.sh/" + encodeURIComponent(topic), {
          method: "POST",
          headers,
          body: String(body || "")
        });
        if (!res.ok) throw new Error("ntfy " + res.status);
        return { ok: true };
      } catch (e) {
        return { ok: false, reason: e.message || "ntfy failed" };
      }
    }
    const ntfySave = document.getElementById("ntfySave");
    if (ntfySave) ntfySave.onclick = () => {
      const v = (document.getElementById("ntfyTopic").value || "").trim();
      if (!/^[a-zA-Z0-9_-]{8,64}$/.test(v)) {
        flash = { text: "Topic must be 8–64 letters, numbers, - or _.", tone: "warn" };
      } else {
        S.ntfyTopic = v; save(S);
        flash = { text: "ntfy topic saved. Subscribe to the same name in the ntfy app." };
      }
      render();
    };
    const ntfyTest = document.getElementById("ntfyTest");
    if (ntfyTest) ntfyTest.onclick = async () => {
      const r = await ntfySend("Daisy — test", "If you see this, ntfy is wired to PupGuide.");
      flash = r.ok ? { text: "ntfy test sent. Check the phone shade." } : { text: "ntfy failed. " + (r.reason || "Save a topic first."), tone: "warn" };
      render();
    };
    const startNap = document.getElementById("startNap");
    if (startNap) startNap.onclick = () => {
      const w = weeksOld(S.puppy.dob);
      S.nap = { id: uid(), start: new Date().toISOString(), plannedMins: crateMins(w), end: null };
      flash = { text: `Nap started · check her at ${fmtTime(napEndAt(S.nap))}. Timed potties are paused.` };
      save(S);
      ntfySend("Daisy — nap check", "Nap window is up. Carry her straight outside.", { "In": String(S.nap.plannedMins) + "m" });
      pushCloud(true).then(() => render());
      render();
    };
    const endNap = document.getElementById("endNap");
    if (endNap) endNap.onclick = () => {
      if (!S.nap) return;
      S.nap.end = new Date().toISOString();
      S.naps.push({ ...S.nap });
      S.nap = null;
      flash = { text: "She’s up. Carry her straight outside, then log the wee." };
      save(S);
      pushCloud(true).then(() => render());
      render();
    };
    const napPlus = document.getElementById("napPlus");
    if (napPlus) napPlus.onclick = () => {
      if (!S.nap) return;
      S.nap.plannedMins = (S.nap.plannedMins || 40) + 10;
      flash = { text: `Nap extended. Check her at ${fmtTime(napEndAt(S.nap))}.` };
      save(S);
      const left = Math.max(10, minsUntil(napEndAt(S.nap)));
      ntfySend("Daisy — nap check", "Extended nap is up. Carry her outside.", { "In": String(left) + "m" });
      pushCloud(true).then(() => render());
      render();
    };
    const cancelNap = document.getElementById("cancelNap");
    if (cancelNap) cancelNap.onclick = () => {
      S.nap = null;
      flash = { text: "Nap cancelled. Potty times are running again." };
      save(S);
      pushCloud(true).then(() => render());
      render();
    };
    document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { tab = b.dataset.goto; render(); });
    document.querySelectorAll("[data-open-skill]").forEach(b => b.onclick = () => { tab = "train"; render(); });
    function stampToday(hm) {
      const d = parseHM(hm || "07:30");
      if (d.getTime() > Date.now() + 2 * 60000) d.setDate(d.getDate() - 1);
      return d;
    }
    function logMeal(mealN, when) {
      const id = uid();
      const food = "Meal " + mealN;
      S.feeds.push({ id, ts: when.toISOString(), food, mealN });
      const nxt = nextMealTime();
      let extra = "Potty in 10–15 min.";
      if (nxt) extra += " Next bowl " + fmtTime(nxt) + ".";
      flash = { text: `Logged ${food} · ${fmtTime(when)}. ${extra}`, undo: { kind: "feed", id } };
      save(S); render();
    }
    document.querySelectorAll("[data-fed]").forEach(b => b.onclick = () => {
      const when = new Date();
      const mealN = inferMealN(when);
      const id = uid();
      const food = "Meal " + mealN;
      S.feeds.push({ id, ts: when.toISOString(), food, mealN });
      const nxt = nextMealTime();
      let extra = "Potty in 10–15 min.";
      if (nxt) {
        const wait = Math.max(1, minsUntil(nxt));
        extra += " Next bowl " + fmtTime(nxt) + ".";
        if (wait >= 1 && wait <= 3 * 24 * 60) {
          ntfySend("Daisy — meal " + (mealN + 1), "Time for the next bowl, then potty 10–15 min after.", {
            Delay: String(Math.floor(nxt.getTime() / 1000))
          });
        }
      }
      ntfySend("Daisy — potty after meal", "Carry her outside. She just ate.", { In: "12m" });
      flash = { text: `Logged ${food} · ${fmtTime(new Date())}. ${extra}`, undo: { kind: "feed", id } };
      save(S); render();
    });
    const addMissed = document.getElementById("addMissed");
    if (addMissed) addMissed.onclick = () => {
      const hm = (document.getElementById("missedTime") || {}).value || "07:30";
      const n = Number((document.getElementById("missedN") || {}).value) || inferMealN(stampToday(hm));
      logMeal(n, stampToday(hm));
    };
    document.querySelectorAll("[data-potty]").forEach(b => b.onclick = () => {
      const id = uid();
      const [where, kind] = b.dataset.potty.split("-");
      S.potty.push({ id, ts: new Date().toISOString(), where, kind });
      const label = (where === "out" ? "Outside " : "Accident ") + (kind === "poo" ? "poo" : "wee");
      flash = { text: `${label} logged · ${fmtTime(new Date())}`, undo: { kind: "potty", id }, tone: where === "in" ? "warn" : "" };
      save(S); render();
    });
    document.querySelectorAll("[data-del-feed]").forEach(b => b.onclick = () => {
      const key = b.dataset.delFeed;
      S.feeds = S.feeds.filter(f => (f.id || f.ts) !== key);
      flash = { text: "Meal removed from the log.", tone: "warn" };
      save(S); render();
    });
    document.querySelectorAll("[data-del-potty]").forEach(b => b.onclick = () => {
      const key = b.dataset.delPotty;
      S.potty = S.potty.filter(p => (p.id || p.ts) !== key);
      flash = { text: "Potty entry removed from the log.", tone: "warn" };
      save(S); render();
    });
    document.querySelectorAll("[data-undo]").forEach(b => b.onclick = () => {
      const [kind, id] = b.dataset.undo.split(":");
      if (kind === "feed") S.feeds = S.feeds.filter(f => f.id !== id);
      if (kind === "potty") S.potty = S.potty.filter(p => p.id !== id);
      flash = { text: "Undone." };
      save(S); render();
    });
    const saveMeals = document.getElementById("saveMeals");
    if (saveMeals) saveMeals.onclick = () => {
      S.puppy.mealTimes = [...document.querySelectorAll("[data-meal-i]")].map(i => i.value);
      save(S); alert("Meal times saved"); render();
    };
    const saveKg = document.getElementById("saveKg");
    if (saveKg) saveKg.onclick = () => {
      const kg = parseFloat(document.getElementById("newKg").value);
      if (!kg) return;
      S.puppy.weightKg = kg;
      S.weights.push({ kg, ts: new Date().toISOString() });
      save(S); render();
    };
    const savePlan = document.getElementById("savePlan");
    if (savePlan) savePlan.onclick = () => {
      S.puppy.dropTo3 = document.getElementById("drop3").value;
      S.puppy.dropTo2 = document.getElementById("drop2").value;
      save(S); render();
    };
    const apply3 = document.getElementById("apply3");
    if (apply3) apply3.onclick = () => {
      S.puppy.mealTimes = suggestedTimes(3);
      S.puppy.meals = 3;
      save(S); render();
    };
    const apply2 = document.getElementById("apply2");
    if (apply2) apply2.onclick = () => {
      S.puppy.mealTimes = suggestedTimes(2);
      S.puppy.meals = 2;
      save(S); render();
    };
    const clr = document.getElementById("clearPotty");
    if (clr) clr.onclick = () => { if (confirm("Clear potty history?")) { S.potty = []; save(S); render(); } };
    document.querySelectorAll("[data-trained]").forEach(b => b.onclick = () => {
      S.training.push({ id: b.dataset.trained, date: todayKey(), ts: new Date().toISOString() });
      save(S); b.textContent = "Logged · nice";
    });
    document.querySelectorAll("[data-sid]").forEach(box => {
      box.onchange = () => { S.social[box.dataset.sid] = box.checked; save(S); };
    });
    const edit = document.getElementById("editPup");
    if (edit) edit.onclick = () => {
      const name = prompt("Her name", S.puppy.name); if (name != null && name.trim()) S.puppy.name = name.trim();
      const dob = prompt("Date of birth (YYYY-MM-DD)", S.puppy.dob); if (dob) S.puppy.dob = dob;
      const wake = prompt("Wake time (HH:MM)", S.puppy.wake); if (wake) S.puppy.wake = wake;
      save(S); render();
    };
    const exp = document.getElementById("exportBtn");
    if (exp) exp.onclick = () => {
      const text = JSON.stringify(S, null, 2);
      navigator.clipboard.writeText(text).then(() => alert("Copied. Paste into Notes if you want a backup.")).catch(() => alert(text));
    };
    const rst = document.getElementById("resetBtn");
    if (rst) rst.onclick = () => {
      if (confirm("Erase all logs and start over?")) { S = structuredClone(DEFAULT); save(S); tab = "home"; render(); }
    };
  }

  function friendlyTs(iso) {
    const d = new Date(iso);
    const k = todayKey(d);
    const prefix = k === todayKey() ? "today" : k === todayKey(new Date(Date.now()-864e5)) ? "yesterday" : k;
    return prefix + " " + fmtTime(d);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
  }

  window._pgTimers = window._pgTimers || [];
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
  async function pingNotify(title, body) {
    try { if (navigator.vibrate) navigator.vibrate([180, 80, 180]); } catch (e) {}
    try {
      document.title = "● " + title;
      setTimeout(() => { document.title = "PupGuide — Puppy Trainer"; }, 8000);
    } catch (e) {}
    if (!("Notification" in window) || Notification.permission !== "granted") return;
    try {
      const reg = await navigator.serviceWorker.ready;
      await reg.showNotification(title, {
        body,
        tag: title,
        silent: false,
        requireInteraction: true,
        vibrate: [180, 80, 180]
      });
    } catch (e) {
      try { new Notification(title, { body, tag: title }); } catch (err) {}
    }
  }
  function armNotify(when, title, body) {
    const ms = when.getTime() - Date.now();
    if (ms < 800 || ms > 8 * 3600 * 1000) return;
    window._pgTimers.push(setTimeout(() => {
      flash = { text: title + " · " + body };
      pingNotify(title, body);
      render();
    }, ms));
  }
  function scheduleReminders() {
    window._pgTimers.forEach(clearTimeout);
    window._pgTimers = [];
    if (!S.notify || !S.onboarded) return;
    const w = weeksOld(S.puppy.dob);
    const meal = nextMealTime();
    if (meal) armNotify(meal, "Daisy — meal", "Food time, then potty 10–15 minutes after");
    const nap = activeNap();
    if (nap) armNotify(napEndAt(nap), "Daisy — nap check", "Nap window is up. Carry her outside.");
  }

  render();
  const _render = render;
  render = function () { _render(); scheduleReminders(); };
  scheduleReminders();
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") syncCloud().then(r => { if (r && r.action === "pull") render(); });
  });
  window.addEventListener("focus", () => {
    syncCloud().then(r => { if (r && r.action === "pull") render(); });
  });
  setInterval(() => {
    syncCloud().then(r => { if (r && r.action === "pull") render(); });
  }, 45000);
  syncCloud().then(r => { if (r && r.action === "pull") render(); });
  </script>
</body>
</html>
